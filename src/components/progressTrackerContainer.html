<div id="progressTrackerContainer" class="card sortable border-secondary mb-3">
    <div class="card-header p-0" data-toggle="collapse" href="#progressTrackerBody">
        <span style="text-align:center">Goal Tracker</span>
    </div>
    <div id="progressTrackerBody" class="card-body show small text-left px-2 pt-2 pb-0"
        data-bind="with: ProgressTracker.trackerList.filter(i => i.isActive()), as: 'trackerList'">
        <div class="text-left" data-bind="foreach: trackerList">
            <div class="mb-2 border-secondary" data-bind="css: { 'border-top pt-2': $index() }">
                <div data-bind="text: name"></div>
                <div class="progress">
                    <div class="progress-bar" role="progressbar"
                        data-bind="attr: { style: 'width:' + (progressPercent() * 100) + '%'},
                            css: { 'bg-primary': progressPercent() < 1, 'bg-success': progressPercent() >= 1 }"
                        aria-valuemin="0" aria-valuemax="100">
                    </div>
                </div>
                <div class="d-flex">
                    <div class="flex-grow-1" data-bind="text: progressText"></div>
                    <div data-bind="text: progressPercent().toLocaleString('en-US', { style: 'percent' })"></div>
                </div>
            </div>
        </div>
        <div class="mb-2 text-muted" data-bind="visible: !trackerList.length">Nothing being tracked!</div>
    </div>
</div>
